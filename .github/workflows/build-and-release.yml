name: Build and Release Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Sync manifest version with release tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        run: |
          TAG="${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}"
          VER="${TAG#v}"
          node -e "
            const fs = require('fs');
            for (const f of ['manifest.json', 'package.json']) {
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              j.version = process.argv[1];
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
          " "$VER"

      - name: Build extension
        run: npm run build

      - name: Package dist/ into zip
        run: |
          cd dist
          zip -r ../mapy-transit-mapper.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapy-transit-mapper
          path: mapy-transit-mapper.zip

      - name: Publish GitHub Release on tag or release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" mapy-transit-mapper.zip --clobber
          else
            gh release create "$TAG" mapy-transit-mapper.zip \
              --title "Mapy.com Transit Connections Mapper $TAG" \
              --generate-notes
          fi

name: Build and Release Extension

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package dist/ into zip
        run: |
          cd dist
          zip -r ../mapy-transit-mapper.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mapy-transit-mapper
          path: mapy-transit-mapper.zip

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" mapy-transit-mapper.zip --clobber
          else
            gh release create "$TAG" mapy-transit-mapper.zip \
              --title "Mapy.com Transit Connections Mapper $TAG" \
              --generate-notes
          fi
